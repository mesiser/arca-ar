<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Стабильный официальный CDN для A-Frame 1.3.0 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- Стабильный CDN для AR.js NFT (через unpkg) -->
    <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <!-- Экран загрузки, пока инициализируется трекинг -->
    <div class="arjs-loader">
        <div>Загрузка AR-модели, подождите...</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- Путь к маркеру с точкой в начале для корректной работы на GitHub Pages -->
        <a-nft
            type="nft"
            url="./IMG_1812"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">
            
            <!-- 3D-модель (масштаб и позицию при необходимости можно скорректировать) -->
            <a-entity
                gltf-model="model_cap.glb"
                scale="10 10 10"
                position="0 0 0"
                rotation="0 0 0">
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
