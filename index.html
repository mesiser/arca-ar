<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arca AR</title>
    
    <!-- 1. Подключаем 3D-фреймворк A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- 1. Подключаем библиотеку Mind-AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .mindar-ui-loading {
            background-color: #fbfbfb !important;
        }
    </style>
</head>
<body>

    <!--
      AR-СЦЕНА:
      imageTargetSrc указывает на файл маркера targets.mind
    -->
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
      
        <!-- Загрузка ресурсов (3D-модели) -->
        <a-assets>
            <a-asset-item id="arcaModel" src="model_cap.glb"></a-asset-item>
        </a-assets>

        <!-- Камера сцены -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!--
          МАРКЕР (targetIndex: 0):
          Когда камера видит фасад дома из targets.mind,
          внутри него отрисовывается модель.
        -->
        <!-- МАРКЕР (targetIndex: 0) -->
        <a-mindar-image-target targetIndex="0">
            <!-- Временно ставим красный куб размером 50х50 см вместо кепки -->
            <a-box position="0 0 0" scale="0.5 0.5 0.5" color="red"></a-box>
        </a-mindar-image-target>
<!--        <a-mindar-image-target targetIndex="0">-->
<!--            <a-gltf-model-->
<!--                id="arcaEntity"-->
<!--                src="#arcaModel"-->
<!--                position="0 0 0"-->
<!--                rotation="0 0 0"-->
<!--                scale="1 1 1">-->
<!--            </a-gltf-model>-->
<!--        </a-mindar-image-target>-->

    </a-scene>

</body>
</html>
