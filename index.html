<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <div class="arjs-loader" id="loader">
        <div>Загрузка AR-модели, подождите...</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- Добавляем свет, чтобы модель не была черной -->
        <a-entity light="type: ambient; color: #BBB; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1" position="-0.5 1 1"></a-entity>

        <a-nft
            type="nft"
            url="https://mesiser.github.io/arca-ar/IMG_1812"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">
            
            <!-- 1. ТЕСТОВЫЙ КРАСНЫЙ КУБ (в центре карточки 3024x4032) -->
            <a-box
                position="1500 2000 250"
                scale="500 500 500"
                material="color: red; opacity: 0.8;">
            </a-box>

            <!-- 2. ВАША 3D-МОДЕЛЬ (увеличен масштаб под размер 3000px) -->
            <a-entity
                gltf-model="model_cap.glb"
                scale="300 300 300"
                position="1500 2000 0"
                rotation="-90 0 0">
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('arjs-nft-loaded', function () {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500);
            }
        });
    </script>
</body>
</html>
