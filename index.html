<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca AR</title>
    <!-- Подключаем A-Frame и модуль AR.js NFT -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <!-- Экран загрузки пока инициализируется трекинг -->
    <div class="arjs-loader">
        <div>Загрузка AR-модели, подождите...</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- Указываем префикс файлов маркера без расширений -->
        <a-nft
            type="nft"
            url="IMG_1812"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">
            
            <!-- 3D модель (масштаб может потребоваться скорректировать) -->
            <a-entity
                gltf-model="model_cap.glb"
                scale="10 10 10"
                position="0 0 0"
                rotation="0 0 0">
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
